server.port=8058
spring.application.name=ebank-bot

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

spring.ai.openai.api-key=${OPENAI_API_KEY:YOUR_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

spring.ai.mcp.client.sse.connections.customer.url=http://localhost:8056
spring.ai.mcp.client.sse.connections.ebank.url=http://localhost:8053

telegram.api.key=${TELEGRAM_BOT_TOKEN:YOUR_TELEGRAM_BOT_TOKEN}
discord.api.key=${DISCORD_BOT_TOKEN:YOUR_DISCORD_BOT_TOKEN}